[project]
name = "ixp-region-node"
version = "0.1.0"
description = "信通院区域节点对接网关"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42",
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
